[project]
name = "edunxt"
version = "0.1.0"
description = "EduNXT study-abroad agent: client intake, university and scholarship drafts, founder review over WhatsApp."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "weasyprint>=62",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["edunxt*"]

[tool.setuptools.package-data]
edunxt = ["agents/prompts/*.md", "documents/templates/*.html", "documents/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
